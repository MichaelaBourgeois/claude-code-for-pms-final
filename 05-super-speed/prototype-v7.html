<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rook Dispatch prototype: a way back for a quiet responder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--main:#1d4ed8;--main-dark:#1e40af;--warn:#b45309;--warn-bg:#fff7ed;--taken:#15803d;--down:#7c3aed;--miss:#b91c1c;--ink:#1f2937;--soft:#6b7280;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f8f9fb;color:var(--ink);font-size:19px;line-height:1.5}
  .label{background:#111827;color:#fff;font-size:14px;padding:8px 20px;display:flex;justify-content:space-between;align-items:center}
  .label button{background:none;border:1px solid #6b7280;color:#fff;border-radius:6px;padding:2px 10px;font-size:13px;cursor:pointer}
  .tabs{display:flex;gap:10px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
  .tabs button{border:2px solid var(--line);padding:10px 20px;border-radius:10px;cursor:pointer;background:#fff;font-size:17px;color:#374151}
  .tabs button.on{background:var(--main);border-color:var(--main);color:#fff}
  .console{display:flex;min-height:640px}
  nav{width:210px;background:#111827;color:#d1d5db;padding:20px 0;font-size:16px;flex-shrink:0}
  nav .logo{color:#fff;font-weight:bold;padding:0 20px 20px;font-size:18px}
  nav div{padding:12px 20px}
  nav div.cur{background:#1f2937;color:#fff;border-left:4px solid #60a5fa}
  nav div.dim{color:#6b7280}
  .body{flex:1;padding:32px 36px;min-width:0}
  h1{font-size:30px;line-height:1.25;margin:0 0 8px}
  h2{font-size:22px;margin:0 0 10px}
  .soft{color:var(--soft);font-size:15px}
  .card{background:#fff;border-radius:14px;padding:24px;margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card.quiet{border-left:8px solid var(--warn)}
  .card.ok{border-left:8px solid var(--taken)}
  .banner{background:#ecfdf5;border-left:8px solid var(--taken);border-radius:10px;padding:16px 20px;margin-bottom:20px;font-size:19px}
  .flag{display:inline-block;color:#fff;font-size:13px;padding:2px 10px;border-radius:14px;white-space:nowrap}
  .flag.q{background:var(--warn)}.flag.n{background:#6b7280}.flag.d{background:var(--taken)}
  .ex{display:inline-block;background:#f3f4f6;color:var(--soft);font-size:12px;padding:1px 8px;border-radius:10px;vertical-align:middle}
  .meta{color:var(--soft);font-size:16px;margin:0 0 12px}
  .btn{display:block;width:100%;padding:18px;border-radius:12px;border:2px solid var(--main);background:var(--main);color:#fff;font-size:20px;font-weight:bold;cursor:pointer;margin-top:12px}
  .btn:hover{background:var(--main-dark)}
  .btn:disabled{background:#e5e7eb;border-color:#e5e7eb;color:#9ca3af;cursor:default}
  .btn.sm{display:inline-block;width:auto;padding:6px 12px;font-size:14px;margin:0;border-radius:8px}
  .pick{display:block;width:100%;text-align:left;padding:20px 24px;margin-bottom:14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
  .pick:hover{border-color:var(--main)}
  .pick small{display:block;color:var(--soft);font-size:16px}
  table{width:100%;border-collapse:collapse;margin-top:6px}
  th{text-align:left;font-size:12px;color:var(--soft);font-weight:normal;padding:6px}
  td{padding:10px 6px;border-top:1px solid var(--line);font-size:15px;vertical-align:middle}
  td.n,th.n{text-align:right;white-space:nowrap}
  tr.after td{background:#fffdf5}
  tr.qrow td{background:var(--warn-bg)}
  tr.qrow{box-shadow:inset 4px 0 0 var(--warn)}
  tr.link{cursor:pointer}tr.link:hover td{background:#f3f4f6}
  tr.qrow.link:hover td{background:#ffedd5}
  .scroll{overflow-x:auto}
  .rank{font-weight:bold;font-size:18px;color:var(--soft)}
  .tag{display:inline-block;padding:2px 10px;border-radius:14px;font-size:14px;color:#fff;white-space:nowrap}
  .t-taken{background:var(--taken)}.t-down{background:var(--down)}.t-missed{background:var(--miss)}
  .t-no{background:#f3f4f6;color:var(--soft);text-decoration:line-through}
  .c-miss{color:var(--miss);font-weight:bold}.c-down{color:var(--down);font-weight:bold}.c-taken{color:var(--taken);font-weight:bold}
  .key{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:#374151;margin:4px 0 8px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
  .count{font-size:19px;margin:12px 0 0}.count b{font-size:26px}
  .who{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .who button,.back{background:#fff;border:2px solid var(--line);border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer;color:var(--ink)}
  .toggle{display:inline-flex;margin:8px 0 14px}
  .toggle button{padding:9px 18px;border:2px solid var(--main);background:#fff;color:var(--main);font-size:16px;cursor:pointer}
  .toggle button:first-child{border-radius:10px 0 0 10px}
  .toggle button:last-child{border-radius:0 10px 10px 0;margin-left:-2px}
  .toggle button.on{background:var(--main);color:#fff}
  .stage{display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px}
  .phone{width:340px;height:640px;border:10px solid #111827;border-radius:38px;background:#fff;overflow-y:auto}
  .phone .in{padding:26px 18px}
  .phone h1{font-size:24px;margin:0}
  .phone h2{font-size:18px;margin:18px 0 6px}
  .phone .card{box-shadow:none;border:1px solid var(--line);padding:14px;margin-bottom:14px}
  .phone td{font-size:13px;padding:8px 3px}
  .phone .tag{font-size:12px;padding:1px 8px}
  .phone p{font-size:16px;margin:8px 0}
  .phone .btn{font-size:17px;padding:14px}
  .seg{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
  .seg button{padding:8px 16px;border-radius:20px;border:2px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
  .seg button.on{border-color:var(--main);color:var(--main);font-weight:bold}
  @media (max-width:760px){nav{display:none}.body{padding:20px 14px}}
  .dash{overflow:auto;max-height:calc(100vh - 330px);min-height:320px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .dash table{margin:0;min-width:1280px}
  .dash thead th{position:sticky;top:0;background:#f9fafb;z-index:2;padding:8px 6px;border-bottom:2px solid var(--line);font-size:12px;color:#374151}
  .dash td{padding:6px;font-size:13px;vertical-align:middle}
  .dash tr.row td{border-top:1px solid var(--line)}
  .dash tr.qrow td{background:var(--warn-bg)}
  .dash tr.qrow td:first-child{box-shadow:inset 5px 0 0 var(--warn)}
  .dash tr.sub td{background:#fff;border-top:0;padding:8px 12px}
  .dash .nm b{font-size:14px}
  .sum{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
  .sum div{flex:1;min-width:130px;background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:13px;color:var(--soft)}
  .sum b{display:block;font-size:24px;color:var(--ink)}
  .sum b.w{color:var(--warn)}
  .dd{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:3px;cursor:help;vertical-align:middle}
  .dd.taken{background:var(--taken)}.dd.down{background:var(--down)}.dd.missed{background:var(--miss)}
  .dd.legit{background:#fff;border:2px dashed #6b7280}
  .acts .btn{display:block;width:100%;margin:0 0 4px;padding:6px 8px;font-size:12px;border-radius:8px;white-space:nowrap}
  .acts .btn.alt{background:#fff;color:var(--main)}
  .panel{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .panel .btn{display:inline-block;width:auto;margin:3px 8px 3px 0;padding:5px 10px;font-size:12px}  .list{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
  .list table{margin:0}
  .list th{padding:12px 14px;font-size:13px;background:#f9fafb;border-bottom:1px solid var(--line)}
  .list td{padding:16px 14px;font-size:17px;border-top:1px solid var(--line)}
  .list tr.item{cursor:pointer}
  .list tr.item:hover td{background:#f3f4f6}
  .list tr.item.q td:first-child{box-shadow:inset 6px 0 0 var(--warn)}
  .list tr.item.q td{background:var(--warn-bg)}
  .list tr.item.q:hover td{background:#ffedd5}
  .list .go{color:var(--main);font-size:22px;text-align:right}
  .line{font-size:17px;color:#374151;margin:6px 0 14px}  .btn.big2{font-size:22px;padding:22px}
  .btn.alt2{background:#fff;color:var(--main)}
  .btn.alt2:hover{background:#eff6ff}
  tr.pm{cursor:pointer}
  tr.pm.sel td{background:#eff6ff}
  tr.pm:hover td{background:#f3f4f6}</style>
</head>

["The Undertow","Harborside","Desmond Okafor",[75,58,16,1],[14,3,2,9],"17 Aug",[["29 Jun",12,9,3,0],["6 Jul",11,9,2,0],["13 Jul",12,9,2,1],["20 Jul",13,10,3,0],["27 Jul",12,10,2,0],["3 Aug",12,9,3,0],["10 Aug",3,2,1,0],["12 Aug",8,2,1,5],["17 Aug",4,1,1,2],["24 Aug",1,0,0,1],["31 Aug",1,0,0,1]],[[41394,"5 Sep","15:17","Harborside","missed"],[41235,"27 Aug","23:18","Harborside","missed"],[41130,"21 Aug","16:45","Harborside","missed"],[41079,"18 Aug","16:18","Harborside","missed"],[41059,"17 Aug","19:07","Harborside","taken"],[41054,"17 Aug","14:10","Greenway","turned down"],[41041,"16 Aug","13:46","Greenway","turned down"],[41011,"14 Aug","10:22","Riverside","missed"]]],
["Vesper","Old Town","Aunt Dot",[86,70,13,3],[17,5,3,9],"17 Aug",[["29 Jun",14,11,3,0],["6 Jul",13,10,2,1],["13 Jul",15,13,1,1],["20 Jul",14,11,3,0],["27 Jul",13,11,1,1],["3 Aug",14,12,2,0],["10 Aug",3,2,1,0],["12 Aug",9,4,1,4],["17 Aug",5,1,1,3],["24 Aug",2,0,1,1],["31 Aug",1,0,0,1]],[[41311,"1 Sep","11:42","Old Town","missed"],[41214,"26 Aug","18:09","Old Town","missed"],[41186,"24 Aug","21:40","Old Town","turned down"],[41165,"23 Aug","20:15","Lakeshore","missed"],[41155,"23 Aug","05:34","Midtown","turned down"],[41153,"23 Aug","00:10","Old Town","missed"],[41102,"19 Aug","18:42","Old Town","missed"],[41050,"17 Aug","08:55","Old Town","taken"]]]
];
var R={};
RAW.forEach(function(r){
  var w=r[6].map(function(x){return x.slice();});
  w.forEach(function(x){if(x[0]==="10 Aug")x[0]="10 to 11 Aug";if(x[0]==="12 Aug")x[0]="12 to 16 Aug";});
  if(w[w.length-1][0]!=="31 Aug")w.push(["31 Aug",0,0,0,0]);
  R[r[0]]={name:r[0],area:r[1],handler:r[2],pre:r[3],post:r[4],lastTaken:r[5],weeks:w,pings:r[7],tickets:r[0]==="The Undertow"?11:0};
});
var NAMES=Object.keys(R);
var S={};NAMES.forEach(function(n){S[n]={legit:{},fresh:false,asked:false};});
var page="team",tab=1,who=null,open=null,scope="all",rpick="The Undertow";

function perWk(n,after){return R[n][after?"post":"pre"][0]/(after?AFTER_WEEKS:BEFORE_WEEKS);}
function rate(n,after){var a=R[n][after?"post":"pre"];return a[3]/a[0]*100;}
function takenRate(n){var a=R[n].post;return a[1]/a[0]*100;}
function last(n){return R[n].weeks[R[n].weeks.length-1][1];}
function usual(n){return Math.round(perWk(n,false));}
function isQuiet(n){return last(n)<perWk(n,false)/2;}
function counted(n){var c=0;R[n].pings.forEach(function(p,i){if(p[4]==="missed"&&!S[n].legit[i])c++;});return c;}
function qi(n){return '"'+n+'"';}
function f1(x){return x.toFixed(1);}
function pct(x){return x.toFixed(0)+'%';}
function ex(t){return ' <span class="ex">'+(t||'Example only')+'</span>';}
function tag(r){return r==="taken"?'<span class="tag t-taken">Taken</span>':r==="missed"?'<span class="tag t-missed">Missed</span>':'<span class="tag t-down">Turned down</span>';}
function key(){return '<div class="key"><span><span class="dot" style="background:var(--taken)"></span>Taken: they said yes</span><span><span class="dot" style="background:var(--down)"></span>Turned down: they said no</span><span><span class="dot" style="background:var(--miss)"></span>Missed: ran out of time</span></div>';}
function flag(n){return S[n].fresh?'<span class="flag d">Fresh start given</span>':isQuiet(n)?'<span class="flag q">Gone quiet</span>':'<span class="flag n">Normal</span>';}
function pl(k){return k+' ping'+(k===1?'':'s');}

/* ranking: taken rate since 12 Aug, high to low; ties broken by lower missed rate since 12 Aug */
function ranked(list){
  return list.slice().sort(function(a,b){
    var d=takenRate(b)-takenRate(a);
    if(Math.abs(d)>1e-9)return d;
    return rate(a,true)-rate(b,true);
  });
}
function allRanked(){return ranked(NAMES);}

function firstCounted(n){for(var i=0;i<R[n].pings.length;i++){if(R[n].pings[i][4]==="missed"&&!S[n].legit[i])return i;}return null;}
function sel(n){var s=S[n];if(s.sel==null||s.legit[s.sel]||R[n].pings[s.sel][4]!=="missed")s.sel=firstCounted(n);return s.sel;}
function pickMiss(n,i){S[n].sel=i;render();}
function markSel(n){var i=sel(n);if(i===null)return;S[n].legit[i]=true;S[n].sel=null;S[n].marked=true;render();}

function listView(list){
  var h='<div class="list"><table><tr><th>Responder</th><th>Area</th><th class="n">Pings this week</th><th>Status</th><th></th></tr>';
  list.forEach(function(n){
    var q=isQuiet(n)&&!S[n].fresh;
    h+='<tr class="item'+(q?' q':'')+'" onclick="openR('+qi(n)+')"><td><b>'+n+'</b></td><td>'+R[n].area+'</td><td class="n"><b>'+last(n)+'</b> <span class="soft">(was about '+usual(n)+')</span></td><td>'+flag(n)+'</td><td class="go">&rsaquo;</td></tr>';
  });
  return h+'</table></div>';
}

function graph(n){
  var w=R[n].weeks,W=720,H=210,left=34,top=20,step=(W-left)/w.length,bw=Math.min(44,step-10),max=22;
  var svg='<svg viewBox="0 0 '+W+' '+(H+top+34)+'" width="100%" style="max-width:760px">';
  [0,10,20].forEach(function(v){
    var y=top+H-v/max*H;
    svg+='<line x1="'+left+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#e5e7eb"/><text x="'+(left-6)+'" y="'+(y+4)+'" font-size="11" fill="#6b7280" text-anchor="end">'+v+'</text>';
  });
  w.forEach(function(v,i){
    var x=left+i*step+(step-bw)/2,y=top+H,parts=[[v[2],"#15803d","Taken"],[v[3],"#7c3aed","Turned down"],[v[4],"#b91c1c","Missed"]];
    parts.forEach(function(pt){
      var hh=pt[0]/max*H;
      if(hh>0){y-=hh;svg+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" fill="'+pt[1]+'"><title>'+v[0]+': '+pt[2]+' '+pt[0]+'</title></rect>';}
    });
    svg+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" font-size="11" font-weight="bold" fill="#1f2937" text-anchor="middle">'+v[1]+'</text>';
    svg+='<text x="'+(x+bw/2)+'" y="'+(top+H+14)+'" font-size="10" fill="#6b7280" text-anchor="middle">'+v[0].replace(' to ','-')+'</text>';
  });
  var mx=left+7*step;
  svg+='<line x1="'+mx+'" y1="'+(top-6)+'" x2="'+mx+'" y2="'+(top+H)+'" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4,3"/><text x="'+(mx+4)+'" y="'+(top-8)+'" font-size="11" fill="#1d4ed8">12 Aug: 4.2 shipped</text></svg>';
  return svg;
}

function detail(n,back){
  var d=R[n],s=S[n],q=isQuiet(n),sl=sel(n),h='';
  if(back)h+='<button class="back" onclick="openR(null)">&larr; My responders</button><div style="height:16px"></div>';
  if(s.fresh)h+='<div class="banner"><b>Fresh start given.</b> Dispatch will offer '+n+' callouts again. Watch the next 2 weeks: pings per week, misses, unfilled callouts.</div>';
  if(s.marked){h+='<div class="banner"><b>Marked as legitimate.</b> That miss no longer counts. Counted misses: '+counted(n)+' of 8.</div>';s.marked=false;}
  h+='<div class="card '+(q&&!s.fresh?'quiet':'ok')+'"><h1>'+(q?n+' has gone quiet. '+pl(last(n))+' this week, was about '+usual(n)+'.':n+' is normal. '+pl(last(n))+' this week, was about '+usual(n)+'.')+'</h1>';
  h+='<p class="meta">'+d.area+' &middot; Handler: '+d.handler+(d.tickets?' &middot; <b>'+d.tickets+' open ping tickets</b>':'')+'</p>';
  if(q){
    h+='<button class="btn big2" onclick="fresh('+qi(n)+')"'+(s.fresh?' disabled':'')+'>Give a fresh start</button>';
    h+='<button class="btn big2 alt2" onclick="markSel('+qi(n)+')"'+(sl===null?' disabled':'')+'>Mark this miss as legitimate</button>';
    h+='<p class="soft">'+(sl===null?'No counted misses left.':'Selected miss: #'+d.pings[sl][0]+'. Click another red row below to pick a different one.')+' Whether these buttons exist, and who may use them, is a proposal.'+ex()+'</p>';
  }
  h+='</div>';
  h+='<div class="card"><h2>Last 8 pings</h2>'+key()+'<table><tr><th>Callout ID</th><th>When</th><th>Callout location</th><th>Result</th></tr>';
  d.pings.forEach(function(p,i){
    var miss=p[4]==="missed",l=s.legit[i],pm=miss&&!l&&q;
    var res=l?'<span class="tag t-no">Missed</span> <span class="soft">not counted</span>':tag(p[4]);
    h+='<tr'+(pm?' class="pm'+(i===sl?' sel':'')+'" onclick="pickMiss('+qi(n)+','+i+')"':'')+'><td>#'+p[0]+'</td><td>'+p[1]+', '+p[2]+'</td><td>'+p[3]+'</td><td>'+res+'</td></tr>';
  });
  h+='</table><p class="count"><b>'+counted(n)+'</b> of the last 8 count as misses.</p></div>';
  h+='<div class="card"><h2>Pings per week</h2>'+key()+graph(n)+'<p class="soft">Each bar is one week, split into taken, turned down and missed. The week of 10 Aug is split at 12 Aug. The last bar is the week of 31 Aug, the latest in the data.</p></div>';
  return h;
}

function handlerTab(){
  var h='<div class="console"><nav><div class="logo">Rook Dispatch</div><div class="dim">Callouts</div><div class="'+(page==="team"?"cur":"")+'" style="cursor:pointer" onclick="setPage(\'team\')">My team</div><div class="'+(page==="overrides"?"cur":"dim")+'" style="cursor:pointer" onclick="setPage(\'overrides\')">Routing overrides</div><div class="dim">Reports</div></nav><div class="body">';
  if(page==="overrides"){h+=overridesView();}else if(!who){
    h+='<h1>Sign in as</h1><p class="soft">Pick a handler.'+ex()+'</p><div style="height:12px"></div>';
    Object.keys(HANDLERS).forEach(function(k){h+='<button class="pick" onclick="signIn('+qi(k)+')">'+k+'<small>'+HANDLERS[k].join(" and ")+'</small></button>';});
  }else{
    var mine=HANDLERS[who];
    h+='<div class="who"><span class="soft">Signed in as <b>'+who+'</b></span><button onclick="switchH()">Switch handler</button></div>';
    if(mine.length===1)h+=detail(mine[0],false);
    else if(open&&mine.indexOf(open)>=0)h+=detail(open,true);
    else h+='<h1>My responders</h1><p class="soft">Click a responder to see their last 8 pings and weekly graph. "Gone quiet" means pings this week are under half the usual weekly number.'+ex()+'</p>'+listView(mine);
  }
  return h+'</div></div>';
}
function setPage(x){page=x;open=null;render();}
function overridesView(){
  var h='<h1>Routing overrides</h1>';
  if(who)h+='<div class="who"><span class="soft">Signed in as <b>'+who+'</b></span><button onclick="switchH()">Switch handler</button></div>';
  h+='<p class="line">When a handler picks a different responder than the one Dispatch recommended, it is logged here. Added in release 4.0 (7 Apr 2026).</p>';
  h+='<div class="card"><h2>Override log</h2><div class="list"><table><tr><th>When</th><th>Handler</th><th>Callout</th><th>Picked instead</th><th>Reason, if typed</th></tr></table></div>';
  h+='<div class="banner" style="background:#fffbeb;border-left-color:var(--warn);margin:16px 0 0"><b>No override rows to show.</b> Overrides are not in the database tables I can read (callouts, pings, responders, handlers, support tickets). Ask Marcus Oyelaran to pull them from 12 Aug.</div></div>';
  h+='<div class="card"><h2>Why it matters here</h2><p>If handlers overrode routing after 12 Aug, some callouts may have skipped the responders who went quiet. We have not tested this.</p><p class="soft">What each row records, per the wiki one-pager (5 Mar 2026): who made the override, when, which responder they picked instead, and a short reason if one was typed. It is shown next to the callout it belongs to.</p></div>';
  return h;
}
function phoneTab(){
  var n=rpick,s=S[n],d=R[n],q=isQuiet(n);
  var h='<div class="stage"><div class="seg">';
  ["The Undertow","Farlight","Meteor Mite","The Gale"].forEach(function(x){h+='<button class="'+(x===n?'on':'')+'" onclick="setR('+qi(x)+')">'+x+'</button>';});
  h+='</div><div class="phone"><div class="in"><h1>'+n+'</h1><p class="meta">'+d.area+' &middot; Handler: '+d.handler+'</p>';
  h+='<div class="card"><b>You had '+pl(last(n))+' this week.</b><br>Before, it was about '+usual(n)+'.</div>';
  if(s.fresh)h+='<div class="banner"><b>Your pings are back.</b> Your handler restarted them.</div>';
  h+='<h2>My past pings</h2><table>';
  d.pings.forEach(function(p,i){
    var l=s.legit[i];
    h+='<tr><td>'+p[1]+'<br>'+p[2]+'</td><td>'+p[3]+'</td><td>'+(l?'<span class="tag t-no">Missed</span><br><span class="soft">Your handler marked this as okay.</span>':tag(p[4]))+'</td></tr>';
  });
  h+='</table><h2>Coming up</h2><p class="soft">New pings arrive live when a callout is near you.</p>';
  if(q&&!s.fresh){
    h+='<div class="card" style="margin-top:14px">A missed ping used to count like saying no. This is changing.'+ex()+'</div>';
    h+=s.asked?'<div class="banner">Your handler has been asked.</div>':'<button class="btn" onclick="ask('+qi(n)+')">Ask my handler to restart</button>';
  }
  h+='</div></div><p class="soft" style="margin-top:12px">Proposed screen, not designed.'+ex()+'</p></div>';
  return h;
}

function render(){
  document.getElementById("t1").className=tab===1?"on":"";
  document.getElementById("t2").className=tab===2?"on":"";
  document.getElementById("root").innerHTML=tab===1?handlerTab():phoneTab();
}
function setTab(t){tab=t;render();}
function signIn(k){who=k;open=null;scope="all";render();}
function switchH(){who=null;open=null;render();}
function setScope(s){scope=s;render();}
function openR(n){open=n;render();window.scrollTo(0,0);}
function setR(n){rpick=n;render();}
function mark(n,i){S[n].legit[i]=true;render();}
function unmark(n,i){S[n].legit[i]=false;render();}
function fresh(n){S[n].fresh=true;render();}
function ask(n){S[n].asked=true;render();}
render();
</script>
